gh guided discovery and reflection."},{t:"Operational fidelity",d:"SOC-oriented scenarios, forensics workflows, and adversary tactics."}],levels:{undergrad:"Undergraduate",graduate:"Graduate / Advanced"}},about:{eyebrow:"About",title:"Biography & academic path.",description:"From full-stack engineering roots to a research career in cybersecurity education, cyber ranges, and European collaborative programmes.",profile:"Profile",education:"Education",experience:"Experience",identifiers:"Identifiers",institution:"Institution page"},contact:{eyebrow:"Contact",title:"Start a conversation.",description:"Research collaboration, speaking invitations, student supervision, or press enquiries—email directly or connect on the networks below.",email:"Email",emailNote:"Preferred channel for academic and research correspondence. Please include a short context line in the subject when possible.",social:"Social & profiles",affiliation:"Affiliation",institution:"Institution",location:"Location",also:"Also",staffPage:"Ionian University staff page"},profile:{name:"Dr. Stylianos Karagiannis",shortName:"S. Karagiannis",title:"Postdoctoral Researcher · Cybersecurity",affiliation:"Department of Informatics, Ionian University",lab:"Networks, Multimedia and Security Systems Laboratory (NMSLab)",location:"Corfu, Greece",bio:"Dr. Stylianos Karagiannis is a Postdoctoral Researcher and Academic Fellow at the Department of Informatics, Ionian University. He completed his Ph.D. in Cybersecurity in 2022, with a thesis on the systematic design, deployment and evaluation of gamified cybersecurity learning environments. His work bridges Capture the Flag (CTF) challenges, Game-Based Learning, Cyber Ranges, adversary emulation, and digital twins—advancing how defenders train against real-world threats.",bioExtended:"He holds an M.Sc. in Information Systems (2017) from Ionian University and a B.Sc. / Diploma in Computer Science, Informatics and Telecommunications (2013) from the Technical University of Larissa, University of Thessaly. Beyond academia, he has served as Senior Researcher on multiple EU Horizon programmes with PDMFC (Lisbon), contributing to AI4CYBER, DYNABIC, DAIS, CYBERSECPRO, SPHINX, AI4HEALTHSEC, MOORE4MEDICAL, and NITRO. He teaches Applied Cryptography, Computer Security and Data Protection, and Digital Forensics and Cyberattack Detection."},researchAreas:[{id:"ctf",title:"Capture the Flag (CTF)",description:"Design, adaptation and evaluation of CTF challenges as structured cybersecurity learning environments, including portable attack–defence platforms such as PocketCTF."},{id:"gbl",title:"Game-Based Learning & Gamification",description:"Theory-driven gamification and serious games for security and privacy education, grounded in constructivist pedagogy and user profiling."},{id:"cyber-ranges",title:"Cyber Ranges & Digital Twins",description:"NICE-aligned cyber ranges for SOC teams, digital-twin based training environments, and interconnected 5G-IoT ranges (NITRO)."},{id:"adversary",title:"Adversary Emulation",description:"ATT&CK-mapped documentation, emulation and mitigation workflows (A-DEMO), AI-powered penetration testing, and red/blue scenarios for 5G/6G."},{id:"healthcare",title:"Healthcare & IoMT Security",description:"DICOM communication simulations, Chidroid log collection for smart healthcare devices, k-anonymity for health data sharing, and incident handling for healthcare supply chains."},{id:"privacy",title:"Privacy Education & Pedagogy",description:"Information privacy pedagogy based on constructivism, escape-room interventions, mobile permission literacy, and ARG-based awareness programmes."}],education:[{degree:"Ph.D. in Cybersecurity",institution:"Ionian University — Department of Informatics",year:"2022",detail:"Thesis: Systematic design, deployment and evaluation of gamified cybersecurity learning environments. Supervisor: Prof. Emmanouil Magkos."},{degree:"M.Sc. in Information Systems",institution:"Ionian University — Department of Informatics",year:"2017",detail:"Focus on Informatics and Information Systems."},{degree:"B.Sc. & Diploma in Computer Science, Informatics & Telecommunications",institution:"Technical University of Larissa — University of Thessaly",year:"2013",detail:"Undergraduate studies in computer science and telecommunications engineering."}],experience:[{role:"Postdoctoral Researcher & Academic Fellow",org:"Ionian University — Department of Informatics / NMSLab",period:"2022 — Present",location:"Corfu, Greece",points:["Research on cyber ranges, CTF, digital twins, LLMs in cybersecurity, and adversary emulation.","Teaching: Applied Cryptography, Computer Security & Data Protection, Digital Forensics.","Institutional representation in EU projects including NITRO (5G-IoT cyber range)."]},{role:"Senior Researcher",org:"PDMFC",period:"2020 — 2025",location:"Lisbon, Portugal",points:["EU Horizon research: AI4CYBER, DYNABIC, DAIS, CYBERSECPRO, SPHINX, AI4HEALTHSEC, MOORE4MEDICAL.","Healthcare cybersecurity, IoMT logging (Chidroid), privacy-preserving data sharing.","AI-powered penetration testing (Shennina) and automated security testing pipelines."]},{role:"Research Scientist",org:"Beyond Vision",period:"2019 — 2021",location:"Portugal",points:["Applied research on cybersecurity tooling and experimental platforms."]}],courses:[{code:"MO140",name:"Applied Cryptography",levelKey:"graduate"},{code:"HY250",name:"Computer Security and Data Protection",levelKey:"undergrad"},{code:"MO260",name:"Digital Forensics and Cyberattack Detection",levelKey:"graduate"}],projectsList:[{name:"ZeroCrowd PhishGame",full:"Live Phishing Simulation Training Arena",role:"Creator · Lead",description:"A gamified cybersecurity education platform that trains genuine phishing-recognition skills—not merely awareness. Analysts examine realistic email simulations across five escalating difficulty tiers, annotate suspicious elements, justify assessments, and issue a final phishing-or-legitimate judgment. Available in English and Greek; additional languages on request.",highlights:["Structured annotation of sender, subject, and body with safe/malicious classification","Reasoning assessed via LLM or deterministic concept-coverage scoring","Nine achievements, five-tier progression, and global top-50 XP leaderboard","Five scoring dimensions · six indicator categories · three arena modes · seven educator sections","Dynamic scenario generation through LLM vs. static traditional awareness training"]},{name:"DICOM Simulation",full:"Medical Imaging Cybersecurity Lab",role:"Lead · GitHub",description:"Python DICOM simulator that sends .dcm files from a local folder to a PACS server using pynetdicom and pydicom. Supports cybersecurity testing of medical imaging communication pipelines, as described in the Applied Sciences 2023 paper."},{name:"eHealth-DT",full:"Digital Twin for Healthcare Services",role:"Lead · GitHub",description:"Digital twin prototype for healthcare services—modelling clinical and infrastructure components to support security analysis, simulation, and service-level experimentation in eHealth environments."},{name:"NITRO",full:"Interconnected 5G-IoT Cyber Range",role:"Researcher / Co-author",description:"An interconnected cyber range targeting 5G and IoT ecosystems, enabling realistic multi-domain training and evaluation scenarios for next-generation network security."},{name:"PocketCTF",full:"Portable Attack & Defense Exercises",role:"Lead author",description:"A fully featured approach for hosting portable attack-and-defense cybersecurity exercises, lowering the barrier to hands-on CTF deployment in academic settings."},{name:"Chidroid",full:"IoMT Log Collection & Security Analysis",role:"Lead author",description:"Android application for retrieving, collecting and distributing logs from smart healthcare devices, enabling dataset creation and edge-oriented security analysis for IoMT."},{name:"A-DEMO",full:"ATT&CK Documentation, Emulation & Mitigation",role:"Lead author",description:"Framework for deploying and documenting realistic cyberattack scenarios with ATT&CK mapping—demonstrated via a rootkit case study for structured red-team documentation."},{name:"NICE-by-Design Cyber Range",full:"Cyber Range for SOC Teams",role:"Lead author",description:"A cyber range designed against the NICE framework for SOC analyst training, covering defence analysis, infrastructure support and vulnerability assessment specialty areas."},{name:"Shennina",full:"AI-Powered Penetration Testing",role:"Co-author",description:"From simulation to validation: integrating AI-driven techniques into penetration testing workflows to accelerate discovery and improve reproducibility of security assessments."},{name:"Digital Twin Cyber Range",full:"SOC Analyst Training Environment",role:"Co-author",description:"A digital twin-based cyber range tailored for Security Operations Center analysts, combining realistic infrastructure models with structured training scenarios."}]},el:{nav:{home:"Αρχική",research:"Έρευνα",publications:"Δημοσιεύσεις",projects:"Έργα",teaching:"Διδασκαλία",about:"Βιογραφικό",contact:"Επικοινωνία"},common:{tagline:"Παίζω . Μαθαίνω . Αμύνομαι",exploreResearch:"Εξερεύνηση έρευνας",publications:"Δημοσιεύσεις",scholar:"Scholar",viewAll:"Όλα →",fullList:"Πλήρης κατάλογος →",allProjects:"Όλα τα έργα →",fullBiography:"Πλήρες βιογραφικό",getInTouch:"Επικοινωνία",liveDemo:"Ζωντανή επίδειξη →",github:"GitHub",launchDemo:"Εκκίνηση ζωντανής επίδειξης",viewGithub:"Προβολή στο GitHub",citations:"αναφορές",cites:"αναφ.",showing:"Εμφάνιση",of:"από",works:"εργασίες",items:"στοιχεία",noPubs:"Καμία δημοσίευση δεν αντιστοιχεί στα φίλτρα.",light:"Φωτεινό",dark:"Σκοτεινό",menu:"Μενού",navigate:"Πλοήγηση",connect:"Σύνδεση",collaborate:"Συνεργασία",featuredLive:"Προβεβλημένο · Ζωντανά",live:"Ζωντανά",platformMetrics:"Μετρικές πλατφόρμας",playLearnDefend:"Παίζω · Μαθαίνω · Αμύνομαι",researchSystems:"Ερευνητικά συστήματα",allProjectsTitle:"Όλα τα έργα",methodolog βερνοασφάλειας. Το έργο του συνδέει προκλήσεις Capture the Flag (CTF), μάθηση βασισμένη στο παιχνίδι, κυβερνοπεδία ασκήσεων (Cyber Ranges), εξομοίωση αντιπάλου και ψηφιακά δίδυμα—προάγοντας τον τρόπο με τον οποίο οι αμυνόμενοι εκπαιδεύονται έναντι πραγματικών απειλών.",bioExtended:"Κατέχει Μεταπτυχιακό Δίπλωμα Ειδίκευσης στα Πληροφοριακά Συστήματα (2017) από το Ιόνιο Πανεπιστήμιο και Πτυχίο / Δίπλωμα στην Επιστήμη Υπολογιστών, την Πληροφορική και τις Τηλεπικοινωνίες (2013) από το ΤΕΙ Λάρισας, Πανεπιστήμιο Θεσσαλίας. Πέραν της ακαδημίας, έχει διατελέσει Ανώτερος Ερευνητής σε πολλαπλά προγράμματα Horizon της ΕΕ με την PDMFC (Λισαβόνα), συνεισφέροντας στα AI4CYBER, DYNABIC, DAIS, CYBERSECPRO, SPHINX, AI4HEALTHSEC, MOORE4MEDICAL και NITRO. Διδάσκει Εφαρμοσμένη Κρυπτογραφία, Ασφάλεια Υπολογιστών και Προστασία Δεδομένων, καθώς και Ψηφιακή Εγκληματολογία και Ανίχνευση Κυβερνοεπιθέσεων."},researchAreas:[{id:"ctf",title:"Capture the Flag (CTF)",description:"Σχεδιασμός, προσαρμογή και αξιολόγηση προκλήσεων CTF ως δομημένων μαθησιακών περιβαλλόντων κυβερνοασφάλειας, συμπεριλαμβανομένων φορητών πλατφορμών επίθεσης–άμυνας όπως το PocketCTF."},{id:"gbl",title:"Μάθηση βασισμένη στο παιχνίδι και παιχνιδοποίηση",description:"Παιχνιδοποίηση και σοβαρά παιχνίδια με θεωρητική βάση για εκπαίδευση ασφάλειας και ιδιωτικότητας, θεμελιωμένα στην κονστρουκτιβιστική παιδαγωγική και στο προφίλ χρήστη."},{id:"cyber-ranges",title:"Κυβερνοπεδία ασκήσεων και ψηφιακά δίδυμα",description:"Κυβερνοπεδία ασκήσεων ευθυγραμμισμένα με NICE για ομάδες SOC, περιβάλλοντα εκπαίδευσης βασισμένα σε ψηφιακά δίδυμα και διασυνδεδεμένα πεδία 5G-IoT (NITRO)."},{id:"adversary",title:"Εξομοίωση αντιπάλου",description:"Ροές τεκμηρίωσης, εξομοίωσης και μετριασμού αντιστοιχισμένες στο ATT&CK (A-DEMO), δοκιμές διείσδυσης με ΤΝ και σενάρια red/blue για 5G/6G."},{id:"healthcare",title:"Ασφάλεια υγείας και IoMT",description:"Προσομοιώσεις επικοινωνίας DICOM, συλλογή καταγραφών Chidroid για έξυπνες ιατρικές συσκευές, k-ανωνυμία για κοινοποίηση δεδομένων υγείας και διαχείριση περιστατικών σε αλυσίδες εφοδιασμού υγείας."},{id:"privacy",title:"Εκπαίδευση ιδιωτικότητας και παιδαγωγική",description:"Παιδαγωγική ιδιωτικότητας πληροφοριών με βάση τον κονστρουκτιβισμό, παρεμβάσεις τύπου escape room, εγγραμματοσύνη αδειών κινητών και προγράμματα ευαισθητοποίησης με ARG."}],education:[{degree:"Διδακτορικό στην Κυβερνοασφάλεια",institution:"Ιόνιο Πανεπιστήμιο — Τμήμα Πληροφορικής",year:"2022",detail:"Διατριβή: Συστηματικός σχεδιασμός, ανάπτυξη και αξιολόγηση παιγνιοποιημένων μαθησιακών περιβαλλόντων κυβερνοασφάλειας. Επιβλέπων: Καθ. Εμμανουήλ Μαγκός."},{degree:"Μ.Δ.Ε. στα Πληροφοριακά Συστήματα",institution:"Ιόνιο Πανεπιστήμιο — Τμήμα Πληροφορικής",year:"2017",detail:"Εστίαση στην Πληροφορική και τα Πληροφοριακά Συστήματα."},{degree:"Πτυχίο / Δίπλωμα στην Επιστήμη Υπολογιστών, Πληροφορική και Τηλεπικοινωνίες",institution:"ΤΕΙ Λάρισας — Πανεπιστήμιο Θεσσαλίας",year:"2013",detail:"Προπτυχιακές σπουδές στην επιστήμη υπολογιστών και τη μηχανική τηλεπικοινωνιών."}],experience:[{role:"Μεταδιδακτορικός Ερευνητής και Ακαδημαϊκός Υπότροφος",org:"Ιόνιο Πανεπιστήμιο — Τμήμα Πληροφορικής / NMSLab",period:"2022 — σήμερα",location:"Κέρκυρα, Ελλάδα",points:["Έρευνα σε κυβερνοπεδία ασκήσεων, CTF, ψηφιακά δίδυμα, Μοντέλα Μεγάλης Γλώσσας στην κυβερνοασφάλεια και εξομοίωση αντιπάλου.","Διδασκαλία: Εφαρμοσμένη Κρυπτογραφία, Ασφάλεια Υπολογιστών και Προστασία Δεδομένων, Ψηφιακή Εγκληματολογία.","Ιδρυματική εκπροσώπηση σε έργα ΕΕ, συμπεριλαμβανομένου του NITRO (κυβερνοπεδίο 5G-IoT)."]},{role:"Ανώτερος Ερευνητής",org:"PDMFC",period:"2020 — 2025",location:"Λισαβόνα, Πορτογαλία",points:["Έρευνα Horizon ΕΕ: AI4CYBER, DYNABIC, DAIS, CYBERSECPRO, SPHINX, AI4HEALTHSEC, MOORE4MEDICAL.","Κυβερνοασφάλεια υγείας, καταγραφές IoMT (Chidroid), κοινοποίηση δεδομένων με διατήρηση ιδιωτικότητας.","Δοκιμές διείσδυσης με ΤΝ (Shennina) και αυτοματοποιημένες αγωγοί δοκιμών ασφαλείας."]},{role:"Ερευνητής Επιστήμονας",org:"Beyond Vision",period:"2019 — 2021",location:"Πορτογαλία",points:["Εφαρμοσμένη έρευνα σε εργαλεία κυβερνοασφάλειας και πειραματικές πλατφόρμες."]}],courses:[{code:"MO140",name:"Εφαρμοσμένη Κρυπτογραφία",levelKey:"graduate"},{code:"HY250",name:"Ασφάλεια Υπολογιστών και Προστασία Δεδομένων",levelKey:"undergrad"},{code:"MO260",name:"Ψηφιακή Εγκληματολογία και Ανίχνευση Κυβερνοεπιθέσεων",levelKey:"graduate"}],projectsList:[{name:"ZeroCrowd PhishGame",full:"Ζωντανή αρένα εκπαίδευσης προσομοίωσης phishing",role:"Δημιουργός · Επικεφαλής",description:"Παιγνιοποιημένη πλατφόρμα εκπαίδευσης κυβερνοασφάλειας που καλλιεργεί πραγματικές δεξιότητες αναγνώρισης phishing—όχι απλώς ενημερότητα. Οι αναλυτές εξετάζουν ρεαλιστικές προσομοιώσεις ηλεκτρονικής αλληλογραφίας σε πέντε κλιμακούμενα επίπεδα δυσκολίας, επισημαίνουν ύποπτα στοιχεία, αιτιολογούν την αξιολόγηση και εκδίδουν τελική κρίση phishing ή νόμιμο. Διατίθεται στα Αγγλικά και τα Ελληνικά· πρόσθετες γλώσσες κατόπιν αιτήματος.",highlights:["Δομημένη επισημείωση αποστολέα, θέματος και σώματος με ταξινόμηση ασφαλούς/κακόβουλου","Αξιολόγηση συλλογιστικής μέσω Μοντέλου Μεγάλης Γλώσσας ή ντετερμινιστικής βαθμολόγησης κάλυψης εννοιών","Εννέα επιτεύγματα, σύστημα προόδου πέντε επιπέδων και παγκόσμιος πίνακας κατάταξης top-50 XP","Πέντε διαστάσεις βαθμολόγησης · έξι κατηγορίες δεικτών · τρεις λειτουργίες αρένας · επτά ενότητες εκπαιδευτή","Δυναμική παραγωγή σεναρίων μέσω ΤΝ έναντι στατικής παραδοσιακής εκπαίδευσης ενημερότητας"]},{name:"DICOM Simulation",full:"Εργαστήριο κυβερνοασφάλειας ιατρικής απεικόνισης",role:"Επικεφαλής · GitHub",description:"Προσομοιωτής DICOM σε Python που αποστέλλει αρχεία .dcm από τοπικό φάκελο σε διακομιστή PACS με pynetdicom και pydicom. Υποστηρίζει δοκιμές κυβερνοασφάλειας αγωγών επικοινωνίας ιατρικής απεικόνισης, όπως περιγράφεται στην εργασία Applied Sciences 2023."},{name:"eHealth-DT",full:"Ψηφιακό δίδυμο για υπηρεσίες υγείας",role:"Επικεφαλής · GitHub",description:"Πρωτότυπο ψηφιακού διδύμου για υπηρεσίες υγείας—μοντε
